<div class="bomdash">
	<div class="bomdash__topbar">
		<div class="bomdash__meta">
			<span class="bomdash__meta-label">BOM Snapshot</span>
			<span class="bomdash__meta-time" data-field="generated-at">--</span>
		</div>
		<div class="bomdash__filters">
			<div class="bomdash__filter"><label>Category</label><div data-field="category-field"></div></div>
			<div class="bomdash__filter"><label>Customer</label><div data-field="customer-field"></div></div>
			<div class="bomdash__filter"><label>Branch</label><div data-field="branch-field"></div></div>
			<div class="bomdash__filter"><label>Assigned To</label><div data-field="assigned-to-field"></div></div>
			<div class="bomdash__filter bomdash__filter--daterange">
				<label>Order Date</label><div data-field="daterange-field"></div>
			</div>
			<div class="bomdash__filter">
				<label>Period</label>
				<select class="bomdash__period-select" data-field="period-select">
					<option value="">All</option>
					<option value="today" selected>Today</option>
					<option value="last_week">Last Week</option>
					<option value="current_week">Current Week</option>
					<option value="this_month">This Month</option>
					<option value="last_month">Last Month</option>
				</select>
			</div>
			<button type="button" class="bomdash__clear-filters" data-field="clear-filters" title="Clear Filter">
				<span class="bomdash__clear-filters-icon">&#x21bb;</span> Clear Filter
			</button>
		</div>
	</div>

	<div class="bomdash__tabs" data-field="setting-type-tabs">
		<button type="button" class="bomdash__tab is-active" data-filter-field="" data-filter-value="">All</button>
		<button type="button" class="bomdash__tab" data-filter-field="setting_type" data-filter-value="Open">Open Setting</button>
		<button type="button" class="bomdash__tab" data-filter-field="setting_type" data-filter-value="Close">Close Setting</button>
		<button type="button" class="bomdash__tab" data-filter-field="setting_type" data-filter-value="Nova Glow">Nova Glow</button>
		<button type="button" class="bomdash__tab" data-filter-field="sub_setting_type1" data-filter-value="Close-Open Setting">Close-Open Setting</button>
	</div>

	<div class="bomdash__grid">
		<section class="bomdash__kpis" data-field="kpi-row">
			<div class="bomdash__loading">Loading status summary…</div>
		</section>

		<section class="bomdash__matrix-wrap">
			<div class="bomdash__matrix-heading">
				<div class="bomdash__section-title" data-field="matrix-title">Assignee &times; Category (Orders)</div>
				<div class="bomdash__matrix-controls">
					<select class="bomdash__matrix-view-select" data-field="matrix-view-select">
						<option value="assignee">Assignee &times; Category</option>
						<option value="status">Status &times; Category</option>
						<option value="customer">Customer &times; Category</option>
					</select>
					<select class="bomdash__matrix-filter" data-field="matrix-filter">
						<option value="">All</option>
						<option value="customer_order">Customer Order</option>
						<option value="customer_stock">Customer Stock</option>
						<option value="gk_order">GK Order</option>
						<option value="gk_stock">GK Stock</option>
						<option value="blank_order_type">No Order Type</option>
						<option value="gk_blank">GK, No Order Type</option>
					</select>
					<select class="bomdash__matrix-status-filter" data-field="matrix-status-filter">
						<option value="">All Statuses</option>
						<option value="pending">Not Started</option>
						<option value="on_hold">On Hold</option>
						<option value="update_item">Update Item</option>
						<option value="update_bom">Update BOM</option>
						<option value="creating_bom">Creating BOM</option>
						<option value="designing">Designing / Rework</option>
						<option value="bom_qc">BOM QC</option>
						<option value="customer_approval">Customer Approval</option>
						<option value="approved">Approved</option>
						<option value="rejected">Rejected / Cancelled</option>
						<option value="other">Other Stage</option>
					</select>
				</div>
			</div>
			<div class="bom-matrix" data-field="matrix">
				<div class="bomdash__loading">Loading matrix…</div>
			</div>
		</section>

		<section class="bomdash__designers-wrap">
			<div class="bomdash__section-title">Assignee Workload</div>
			<input type="text" class="bomdash__designer-search" data-field="assignee-search" placeholder="Search assignee…" />
			<div class="bom-designers" data-field="workload-list">
				<div class="bomdash__loading">Loading workload…</div>
			</div>
		</section>

		<aside class="bomdash__alerts">
			<div class="bomdash__section-title">Due-Date Alerts</div>
			<div class="bom-alerts" data-field="alerts-board">
				<div class="bomdash__loading">Loading alerts…</div>
			</div>
		</aside>

		<aside class="bomdash__design-types">
			<div class="bomdash__section-title">BOM Documents</div>
			<div class="bom-alerts" data-field="bom-doc-board">
				<div class="bomdash__loading">Loading BOM documents…</div>
			</div>
		</aside>
	</div>
</div>
