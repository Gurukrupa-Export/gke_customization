exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false

default_language_version:
  node: system

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
        files: "gke_customization.*"
        exclude: ".*json$|.*txt$|.*csv|.*md"
      - id: check-yaml
      - id: no-commit-to-branch
        args:
          - '--branch'
          - 'develop'
          - '--branch'
          - 'master'
          - '--branch'
          - 'kggk-prod'
          - '--branch'
          - 'kggk_uat'
          - '--branch'
          - 'gurukrupa-uat'
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: local
    hooks:
      - id: no-push-to-protected-branch
        name: "Block direct push to protected branches"
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        entry: >-
          bash -c 'case "${PRE_COMMIT_REMOTE_BRANCH#refs/heads/}" in
          develop|master|kggk-prod|kggk_uat|gurukrupa-uat)
          echo "Direct push to ${PRE_COMMIT_REMOTE_BRANCH#refs/heads/} is not allowed. Raise a pull request."; exit 1;;
          esac'

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                gke_customization/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                gke_customization/templates/includes/.*|
                gke_customization/gke_hrms/report/attendance_punch_error_report/attendance_punch_error_report.js|
                gke_customization/gke_hrms/report/employee_punch_error/employee_punch_error.js|
                gke_customization/gke_hrms/doctype/employee_demotion/employee_demotion.js
            )$

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                gke_customization/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                gke_customization/public/js/controllers/.*|
                gke_customization/templates/pages/order.js|
                gke_customization/templates/includes/.*|
                gke_customization/gke_hrms/report/attendance_punch_error_report/attendance_punch_error_report.js|
                gke_customization/gke_hrms/report/employee_punch_error/employee_punch_error.js|
                gke_customization/gke_hrms/doctype/employee_demotion/employee_demotion.js
            )$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.0
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
